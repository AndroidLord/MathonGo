<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: __TEXT_COLOR__;
    font-family: "Times New Roman", Times, Georgia, serif;
    font-size: __FONT_SIZE__px;
    line-height: __LINE_HEIGHT__;
    overflow-x: hidden;
    overflow-wrap: break-word;
    word-break: break-word;
    letter-spacing: 0;
    -webkit-text-size-adjust: 100%;
  }
  #root {
    display: flow-root;
  }
  #root > *:first-child { margin-top: 0; }
  #root > *:last-child { margin-bottom: 0; }
  #root > img:only-child { margin: 0; }
  p { margin: 0 0 6px 0; }
  ul, ol { margin: 0 0 6px 0; }
  li { margin-bottom: 6px; }
  strong, b { font-weight: 700; }
  img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0.5em 0;
    border-radius: 6px;
    min-height: 32px;
    background-color: __PLACEHOLDER_COLOR__;
    background-image: linear-gradient(
      90deg,
      __PLACEHOLDER_COLOR__ 0%,
      __PLACEHOLDER_HIGHLIGHT__ 50%,
      __PLACEHOLDER_COLOR__ 100%
    );
    background-size: 200% 100%;
    animation: imgLoading 1.2s ease-in-out infinite;
  }
  img.loaded {
    min-height: 0;
    background: none;
    animation: none;
  }
  img.broken { display: none; }
  @keyframes imgLoading {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    img { animation: none; }
  }
  a { color: __LINK_COLOR__; }
  table {
    border-collapse: collapse;
    width: auto;
    margin: 0.5em 0;
  }
  th, td {
    border: 1px solid __BORDER_COLOR__;
    padding: 6px 10px;
    text-align: left;
  }
  .table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    max-width: 100%;
  }
  mjx-container { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
  mjx-container[display="true"] { margin: 0.6em 0; }
  mjx-container svg { max-width: 100%; }
</style>
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    options: {
      enableMenu: false,
      menuOptions: { settings: { inTabOrder: false } }
    },
    svg: { fontCache: 'local' },
    startup: {
      typeset: true,
      pageReady: function () {
        return MathJax.startup.defaultPageReady()
          .then(reportReady)
          .catch(reportReady);
      }
    }
  };

  function currentHeight() {
    // Measure the content wrapper only. body.scrollHeight rounds up to the viewport and folds in
    // collapsed margins, which left visible dead space under short content such as an option image.
    var root = document.getElementById('root');
    if (!root) return 0;
    return Math.ceil(root.getBoundingClientRect().height);
  }

  function postHeight() {
    if (window.AndroidBridge && window.AndroidBridge.onHeightChanged) {
      window.AndroidBridge.onHeightChanged(currentHeight());
    }
  }

  function reportReady() {
    postHeight();
    if (window.AndroidBridge && window.AndroidBridge.onRenderComplete) {
      window.AndroidBridge.onRenderComplete();
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    // Hide images that never arrive rather than leaving a broken-image box.
    Array.prototype.forEach.call(document.images, function (img) {
      img.addEventListener('error', function () {
        img.classList.add('broken');
        postHeight();
      });
      img.addEventListener('load', function () {
        img.classList.add('loaded');
        postHeight();
      });
      if (img.complete && img.naturalWidth > 0) img.classList.add('loaded');
    });

    // Wrap wide tables so they scroll inside themselves instead of widening the page.
    Array.prototype.forEach.call(document.querySelectorAll('table'), function (table) {
      var wrap = document.createElement('div');
      wrap.className = 'table-scroll';
      table.parentNode.insertBefore(wrap, table);
      wrap.appendChild(table);
    });

    if (window.ResizeObserver) {
      new ResizeObserver(postHeight).observe(document.getElementById('root'));
    }
    postHeight();
  });

  window.addEventListener('load', postHeight);
</script>
<script src="mathjax/tex-mml-svg.js" id="MathJax-script"></script>
</head>
<body>
<div id="root">__CONTENT__</div>
</body>
</html>
